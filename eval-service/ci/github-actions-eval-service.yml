name: eval-service

on:
  push:
    paths:
      - "eval-service/**"
      - ".github/workflows/eval-service.yml"
  pull_request:
    paths:
      - "eval-service/**"
      - ".github/workflows/eval-service.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eval-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Pytest
        run: pytest -q
      - name: CLI sync smoke
        run: python scripts/sync_main_table.py --demo --import tests/fixtures/livellm_lab.jsonl --dest runs/ci-MAIN_TABLE.md
      - name: Offline demo + completeness smoke
        run: |
          python - <<'PY'
          from pathlib import Path
          from app.livellm_import import load_path
          from app.main_table import Cell, MainTable
          from app.offline_scorer import run_offline_demo

          t = MainTable()
          t.ingest_demo_scorecard(run_offline_demo(Path("runs/ci-demo"), 1), 1)
          keys = (
              "bench", "harness", "mode", "k", "pass_rate", "pass_rate_sd",
              "steps", "steps_sd", "n_seeds", "status", "source", "meta",
          )
          for name in (
              "livellm_sample.jsonl",
              "livellm_seeds.jsonl",
              "livellm_lab.jsonl",
          ):
              for row in load_path(Path("tests/fixtures") / name):
                  t.put(Cell(**{k: row.get(k) for k in keys if k in row or k == "meta"}))
          c = t.completeness(1)
          assert c["complete"] is True, c
          assert c["pct"] == 100.0, c
          print("completeness_ok", c["ready_slots"], c["benches_ready"])
          PY
